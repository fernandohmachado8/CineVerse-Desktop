name: Desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python scripts/audit_publication.py
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
  windows:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s thermal -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run icons
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
